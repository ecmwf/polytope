[package]
name = "polytope"
repo = "ecmwf/polytope"
visibility = "public"
fork-pull-requests = false
allow-stale-deps = true
compiler-inputs = []
ci-pre-commit = false
full-history = true

[[deps]]
repo = "ecmwf/gribjump"
package = "pygribjump"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
python-version-input = "python-version"

# A pure-Python upstream, built on the GitHub runner rather than in this container.
[[deps]]
repo = "ecmwf/conflator"
package = "conflator"
ref = "main"
compiler-inputs = []
python-version-input = "python-version"
platform-input = "python-platform"
build-type-input = "python-build-type"

[matrix.test]
triggers = ["upstream-change", "rebuild-request"]

# gribjump's Ubuntu 24.04 and gcc 13, plus Rust for polytope's extension.
[matrix.test.defaults]
job-script = "./.ci/test.sh.j2"
runs-on = "ubuntu-latest"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13-boost-qt6-rust1.90"
platform = "ubuntu-24.04"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
build-type = "RelWithDebInfo"
python-platform = "gh-ubuntu-26.04"
python-build-type = "Release"
extras = "tests"
pytest-args = "-m 'not fdb' tests"

# pygribjump is built for 3.12 to 3.14 only.
[[matrix.test.include]]
python-version = "3.12"

[[matrix.test.include]]
python-version = "3.13"
